name: Build StockSlip APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

timeout-minutes: 30

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StockSlip project ZIP into repository root
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'StockSlip_Project.zip' -o -iname 'StockSlip_Project*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ];nthen
            echo "StockSlip ZIP not found. Upload StockSlip_Project.zip first."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded ZIP."
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .
          test -f package.json
          test -d www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync app files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockSlip-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
