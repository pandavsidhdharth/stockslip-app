name: Build StockSlip APK from uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract StockSlip ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \( -iname 'StockSlip_Project.zip' -o -iname 'StockSlip_Project*.zip' \) -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: StockSlip_Project.zip was not found in the repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name 'package.json' -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            exit 1
          fi

          cp -a "$PROJECT_DIR/." .

          test -f package.json
          test -f capacitor.config.json
          test -d www

          # The ZIP contains its own older GitHub workflows. Remove those copies
          # so only this corrected root workflow controls the APK build.
          rm -f .github/workflows/build-android-apk.yml
          rm -f .github/workflows/deploy-pages.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync app files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockSlip-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
